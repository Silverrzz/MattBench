[Service]
WorkingDirectory=/opt/mattbench-prod
EnvironmentFile=/etc/mattbench-prod/production.env
Environment=PYTHONUNBUFFERED=1
ExecStart=
ExecStart=/opt/mattbench-prod/venv/bin/python -m gunicorn --config /etc/mattbench-prod/gunicorn_config.py OpenSite.asgi:application
Restart=always
RestartSec=5
UMask=0077
